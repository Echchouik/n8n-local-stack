events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Instance principale (UI, API, webhooks de TEST)
    upstream n8n_main {
        server n8n:5678;
    }

    # Webhook processor (webhooks de PRODUCTION)
    upstream n8n_webhook {
        server n8n-webhook:5678;
    }

    # Monitoring
    upstream grafana {
        server grafana:3000;
    }

    upstream prometheus {
        server prometheus:9090;
    }

    upstream alloy {
        server alloy:12345;
    }

    # --- stub_status pour nginx-exporter (port interne, non publié) ---
    server {
        listen 8081;
        server_name _;
        access_log off;
        location = /stub_status {
            stub_status;
        }
    }

    # --- HTTP : redirection vers HTTPS ---
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        # 8443 = port HTTPS publié côté hôte (HTTPS_PORT dans .env) ; adapter si tu passes en 443
        return 301 https://$host:8443$request_uri;
    }

    # --- HTTPS ---
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        # Même port que côté hôte : https://n8n.localhost:8443 marche aussi depuis les conteneurs
        listen 8443 ssl;
        http2 on;
        server_name n8n.localhost localhost;

        # Certificats générés par mkcert (nginx/certs/)
        ssl_certificate     /etc/nginx/certs/n8n.pem;
        ssl_certificate_key /etc/nginx/certs/n8n-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        client_max_body_size 50m;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log warn;

        # Réglages proxy communs
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;

        # Les métriques n8n sont lues par Prometheus en direct (n8n:5678), pas via le proxy
        location = /metrics {
            return 404;
        }

        # Grafana (servi sous /grafana/, cf. GF_SERVER_SERVE_FROM_SUB_PATH)
        location /grafana/ {
            proxy_pass http://grafana;
        }

        # Prometheus (servi sous /prometheus/, cf. --web.route-prefix) — sans authentification : local uniquement
        location /prometheus/ {
            proxy_pass http://prometheus;
        }

        # Alloy : UI de debug du pipeline de logs (servie sous /alloy/) — local uniquement
        location /alloy/ {
            proxy_pass http://alloy;
        }

        # Webhooks de production -> webhook processor
        location /webhook/ {
            proxy_pass http://n8n_webhook;
        }

        # Tout le reste -> instance principale
        location / {
            proxy_pass http://n8n_main;
        }
    }
}
