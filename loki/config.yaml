# Loki en mode "monolithique" (un seul processus), stockage sur disque local
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h        # 7 jours
  discover_log_levels: true     # ajoute detected_level (error/warn/info/debug) à chaque ligne
  discover_service_name: [service_name, service, container]
  ingestion_rate_mb: 8          # marge au démarrage de la stack (rafale de logs)
  ingestion_burst_size_mb: 16
  max_query_series: 1000
  allow_structured_metadata: true
  volume_enabled: true          # requis par Grafana Logs Drilldown

pattern_ingester:
  enabled: true                 # détection de motifs dans Logs Drilldown

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
