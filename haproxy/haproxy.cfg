# HAProxy : point d'entrée Redis unique pour n8n (QUEUE_BULL_REDIS_HOST=haproxy).
# Interroge les 3 nœuds chaque seconde et ne route que vers celui qui répond "role:master".
# Sentinel décide qui est master ; HAProxy se contente de suivre.
#
# ${REDIS_PASSWORD} est remplacé par HAProxy depuis l'environnement du conteneur.

global
    log stdout format raw local0 info
    maxconn 1024

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 3s
    # Bull garde des connexions ouvertes (commandes bloquantes) : timeouts longs
    timeout client 1h
    timeout server 1h
    timeout check 2s

# Résolution DNS dynamique : un nœud recréé change d'IP.
# parse-resolv-conf : marche avec le DNS embarqué de Docker comme avec aardvark-dns (Podman).
resolvers containers
    parse-resolv-conf
    hold valid 1s
    hold obsolete 1s
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s

frontend redis_in
    bind :6379
    default_backend redis_master

backend redis_master
    option tcp-check
    tcp-check connect
    tcp-check send "AUTH ${REDIS_PASSWORD}\r\n"
    tcp-check expect string +OK
    tcp-check send "PING\r\n"
    tcp-check expect string +PONG
    tcp-check send "INFO replication\r\n"
    tcp-check expect string role:master
    tcp-check send "QUIT\r\n"
    tcp-check expect string +OK
    # inter 1s / fall 2 : un master rétrogradé est retiré en ~2s
    # on-marked-down shutdown-sessions : coupe les connexions vers l'ancien master
    #   -> n8n se reconnecte, et HAProxy l'envoie vers le nouveau
    # init-addr none : HAProxy démarre même si un nœud n'est pas encore résolvable
    default-server check inter 1s fall 2 rise 2 resolvers containers init-addr none on-marked-down shutdown-sessions
    server redis-1 redis-1:6379
    server redis-2 redis-2:6379
    server redis-3 redis-3:6379

# Métriques Prometheus (exporter intégré à HAProxy) + sonde de santé du conteneur
frontend stats
    mode http
    bind :8404
    monitor-uri /healthz
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s
